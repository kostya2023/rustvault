[package]
name = "backend_app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
axum = "0.8.9"
base64 = "0.23.1"
blake3 = "1.8.7"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
minio = "0.4.0"
num-traits = "0.2.19"
opaque-ke = { version = "4.0.1", features = ["argon2"] }
rand = "0.10.3"
redis = { version = "1.8.0", features = ["tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "time", "ipnetwork", "uuid", "json"] }
thiserror = "2.0.21"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
tokio = { version = "1.54.1", features = ["full"] }
totp-rs = { version = "6.0.0", features = ["otpauth"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "time", "json"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras", "time", "uuid"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
uuid = { version = "1.29.0", features = ["serde", "v4", "v5"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
